services:
  sentinel:
    build: .
    ports: ["8000:8000"]
    environment:
      SENTINEL_DATA_DIR: /app/data
    volumes: ["sentinel-data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  sentinel-data:
